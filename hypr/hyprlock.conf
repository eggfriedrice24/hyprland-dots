source = ~/p/eggfriedrice.nvim/extras/hyprland/eggfriedrice.conf

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    outer_color = $yellow          # focus
    inner_color = $bg
    font_color = $fg
    font_family = $font_ui
    fade_on_empty = true
    placeholder_text =
    halign = center
    valign = center
}

# small clock above the field: tells a locked screen apart from a frozen one. hyprlock sets a
# label's weight itself, so the emphasis weight goes through markup; 28 is a display size above
# the text scale
label {
    monitor =
    text = <span weight="$font_weight_emphasis">$TIME</span>
    color = $fg
    font_family = $font_ui
    font_size = 28
    position = 0, 70
    halign = center
    valign = center
}
