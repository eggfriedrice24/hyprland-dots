# Installed by the dotfiles (install/stages/01-packages.sh) to /etc/makepkg.conf.d/no-debug.conf.
# Arch's makepkg.conf has `debug` in OPTIONS, so every AUR build also produces a <pkg>-debug package
# and makepkg -si / yay install it: debug symbols nobody here reads. makepkg checks OPTIONS from the
# end, so this later !debug wins over the default.
OPTIONS+=(!debug)
