# dotfiles (install/stages/07-snapshots.sh): vfat in every initramfs. A snapshot booted with a
# newer kernel than its own has no modules for that kernel, so after switch_root nothing could load
# vfat and /boot (the ESP) would not mount; loaded from the initramfs, it already is.
# mkinitcpio skips a module it has added once, so bootstrap.sh's MODULES=(vfat) does no harm.
MODULES+=(vfat)
