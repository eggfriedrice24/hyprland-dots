monitor.alsa.rules = [
  {
    # Keep the Beosound A1 USB mic always active. When the source is
    # suspended, games that probe the mic with a short init timeout
    # (Arc Raiders / Vivox) intermittently report "no audio input".
    matches = [
      { node.name = "~alsa_input.usb-Bang_Olufsen.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
