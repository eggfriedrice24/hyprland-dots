monitor.bluez.properties = {
  # Enable all codecs - prefer high quality
  bluez5.enable-sbc-xq = true
  bluez5.enable-msbc = true
  bluez5.enable-hw-volume = true

  # Reconnect on profile availability changes
  bluez5.auto-connect = [ a2dp_sink hfp_hf ]
}

# Never auto-switch a device to HSP/HFP when an app opens its mic - keeps
# A2DP quality. Switch the card profile manually if the Beosound speakerphone
# mic is ever needed while on Bluetooth:
#   pactl set-card-profile bluez_card.78_5E_A2_E0_5B_66 headset-head-unit
# (The old "bluez5.autoswitch-profile" key here was not a real setting; this
# is the one WirePlumber 0.5 actually reads.)
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}

monitor.bluez.rules = [
  {
    matches = [
      { device.name = "~bluez_card.*" }
    ]
    actions = {
      update-props = {
        bluez5.a2dp.aac.bitratemode = 0

        # Don't suspend BT nodes when idle
        session.suspend-timeout-seconds = 0
      }
    }
  }
  {
    # Disable HSP/HFP on WH-1000XM5 so Discord can't hijack the profile
    matches = [
      { device.name = "bluez_card.88_C9_E8_63_16_A4" }
    ]
    actions = {
      update-props = {
        bluez5.hw-offload-sco = false
        bluez5.roles = [ a2dp_sink ]
        device.profile = "a2dp-sink"
      }
    }
  }
  {
    # Keep Bluetooth playback at a large fixed quantum for stability.
    # Replaces the old global min-quantum floor in pipewire.conf.d/
    # 51-bluetooth.conf, which broke game voice chat capture.
    matches = [
      { node.name = "~bluez_output.*" }
    ]
    actions = {
      update-props = {
        node.force-quantum = 1024
      }
    }
  }
]
