context.properties = {
  # Default buffer size; Bluetooth stability is handled per-device in
  # wireplumber 51-bluez-config.conf (node.force-quantum) instead of a
  # global floor, so voice chat capture can run at ~10 ms again.
  default.clock.quantum = 1024

  # Low floor so game voice (Vivox wants 480/48000 = 10 ms) is not
  # delivered in bursts - large bursts cause choppy transmitted voice.
  default.clock.min-quantum = 256

  # Ceiling clamps Arc Raiders' proximity voice capture request of
  # 2880 samples / 60 ms (ValveSoftware/Proton issue 9401) to 21 ms.
  default.clock.max-quantum = 1024
}
