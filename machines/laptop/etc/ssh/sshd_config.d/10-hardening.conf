# Key-only SSH on the laptops, which sit on hotel and cafe networks. Installed by stage 6 of
# install.sh, so bootstrap's password login stays available as the rescue path until the dotfiles
# are in. sshd reads this before /etc/ssh/sshd_config, and the first value it sees wins.
# Takes effect at the next sshd restart or boot.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
