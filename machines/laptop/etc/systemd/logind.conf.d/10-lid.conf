# Laptops: the lid closed on external power keeps the machine running, like a small server that
# stays reachable over tailscale; the session locks and the panel turns off (machines/laptop/hypr.lua).
# On battery the lid still suspends (systemd's default), and a docked laptop is ignored as before.
# Installed by stage 6 of install.sh; logind reads it at boot.
[Login]
HandleLidSwitchExternalPower=ignore
