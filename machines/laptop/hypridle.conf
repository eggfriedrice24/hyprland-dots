# Laptop idle: dim, lock, display off, and suspend when on battery.
# Used by every profile that extends the laptop layer (machines/laptop/hypr.lua, field hypridle);
# the desktop keeps the lock-only hypr/hypridle.conf.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# dim the panel, back to the saved level on activity
listener {
    timeout = 150    # 2.5 minutes
    on-timeout = brightnessctl -q -c backlight -s set 10%
    on-resume = brightnessctl -q -c backlight -r
}

listener {
    timeout = 300    # 5 minutes
    on-timeout = loginctl lock-session
}

# misc.key_press_enables_dpms (laptop layer) lets a key press wake the display as well as the mouse
listener {
    timeout = 330    # 5.5 minutes
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# suspends only while discharging; on AC the laptop stays locked with the display off
listener {
    timeout = 900    # 15 minutes
    on-timeout = ~/.config/hypr/scripts/idle-suspend
}
