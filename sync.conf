# What bin/dots-sync carries between machines. One "KEY value" per line, paths relative to $HOME.

# Claude Code config dirs: `claude` uses ~/.claude, `claudew` ~/.claude-work (CLAUDE_CONFIG_DIR).
# Carried: CLAUDE.md, settings.json, skills, agents, commands, plugins, every project's memory and
# the user MCP servers with their env and headers (API keys), merged into the receiver's .claude.json.
# Never the login tokens (.credentials.json). Syncing from a machine lets it run code on this one.
claude .claude
claude .claude-work

# Project roots. Every git repo in them is carried with git's own view of what matters; folders
# that are not repos are copied as they are, minus the excludes below.
root p
root tth
root nox

# Files git ignores that are carried anyway (basename globs): secrets and local settings that
# exist only on disk.
keep .env
keep .env.*
keep .envrc
keep .dev.vars
keep settings.local.json

# Never copied from folders that are not repos (repos follow their .gitignore instead).
exclude node_modules
exclude target
exclude .venv
exclude venv
exclude __pycache__
exclude .next
exclude .turbo
exclude .cache

# Entries to leave out altogether, for example large recordings:
# skip p/bondid-recordings
