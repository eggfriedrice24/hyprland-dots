# vim: ft=tmux
# Layout only. Colours are #{@eggfriedrice_*} user options set by the extra that
# tmux.conf sources last; the style options (status-style, window-status-*-style,
# pane borders, message, mode) live there as well.

set -g status "on"
set -g status-interval 1
set -g status-justify "left"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left "#[fg=#{@eggfriedrice_bg_light},bg=#{@eggfriedrice_fg},bold] #S:#I.#P #[fg=#{@eggfriedrice_fg},bg=#{@eggfriedrice_fg_dark},nobold,nounderscore,noitalics]#[fg=#{@eggfriedrice_bg},bg=#{@eggfriedrice_fg_dark},bold] #(whoami) #[fg=#{@eggfriedrice_fg_dark},bg=#{@eggfriedrice_bg_dark}]"
set -g status-right "#[fg=#{@eggfriedrice_fg_gutter_ui},bg=#{@eggfriedrice_bg_dark},nobold,nounderscore,noitalics]#[fg=#{@eggfriedrice_fg_dark},bg=#{@eggfriedrice_fg_gutter_ui}]#[fg=#{@eggfriedrice_comment},bg=#{@eggfriedrice_fg_gutter_ui},nobold,nounderscore,noitalics]#[fg=#{@eggfriedrice_fg_dark},bg=#{@eggfriedrice_comment}]#[fg=#{@eggfriedrice_fg_dark},bg=#{@eggfriedrice_comment},nobold,nounderscore,noitalics]#[fg=#{@eggfriedrice_bg},bg=#{@eggfriedrice_fg_dark},bold] #h "

setw -g window-status-separator ""
setw -g window-status-format '#[fg=#{@eggfriedrice_bg_dark},bg=#{@eggfriedrice_bg_dark}]#[default] #I  #{b:pane_current_path} #[fg=#{@eggfriedrice_bg_dark},bg=#{@eggfriedrice_bg_dark},nobold,nounderscore,noitalics]'
setw -g window-status-current-format '#[fg=#{@eggfriedrice_bg_dark},bg=#{@eggfriedrice_fg}]#[fg=#{@eggfriedrice_bg},bg=#{@eggfriedrice_fg}] #I #[fg=#{@eggfriedrice_bg},bg=#{@eggfriedrice_yellow}] #{b:pane_current_path} #[fg=#{@eggfriedrice_yellow},bg=#{@eggfriedrice_bg_dark},nobold]'
