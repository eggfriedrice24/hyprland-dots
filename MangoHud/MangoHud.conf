# MangoHud overlay: only what helps judge smoothness.
# Enable per game with `mangohud %command%` in Steam launch options.
# Right Shift+F12 toggles the overlay, Right Shift+F11 moves it.

legacy_layout=false
position=top-left
font_size=20
background_alpha=0.4
round_corners=6

# frame rate and frame pacing: a flat graph is smooth, spikes are hitches
fps
frametime
frame_timing

# where the bottleneck is
cpu_stats
cpu_temp
gpu_stats
gpu_temp
gpu_core_clock
vram

# the 7950X iGPU is card0; report the 7900 XTX
pci_dev=0000:03:00.0

# logging: every session writes a CSV (fps, frametime, cpu/gpu load, temps, clocks, vram, ram)
# Left Shift+F2 starts/stops a log by hand; autostart logs the whole session
output_folder=/home/eggfriedrice/.local/share/game-monitor/mangohud
log_interval=100
autostart_log=1
toggle_logging=Shift_L+F2

toggle_hud=Shift_R+F12
toggle_hud_position=Shift_R+F11
