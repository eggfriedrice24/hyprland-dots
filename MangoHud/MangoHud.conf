# MangoHud overlay: one small line with fps, frame time and a pacing graph.
# Enable per game with `mangohud %command%` in Steam launch options.
# Right Shift+F12 toggles the overlay, Right Shift+F11 moves it.

legacy_layout=false
horizontal
hud_compact
hud_no_margin
position=top-left
font_size=16
background_alpha=0.25
round_corners=4

# frame rate and frame pacing: a flat graph is smooth, spikes are hitches
fps
# label the fps row "FPS" instead of the graphics layer (VKD3D, DXVK, VULKAN...)
fps_text=FPS
frametime
frame_timing
# load only, no temps/clocks/vram on screen (the CSV log still records all of them)
cpu_stats
gpu_stats

# the 7950X iGPU is card0; report the 7900 XTX
pci_dev=0000:03:00.0

# logging: a session log is a CSV (fps, frametime, cpu/gpu load, temps, clocks, vram, ram)
# Left Shift+F2 starts/stops a log by hand (a red dot shows while it records)
output_folder=/home/eggfriedrice/.local/share/game-monitor/mangohud
log_interval=100
toggle_logging=Shift_L+F2

toggle_hud=Shift_R+F12
toggle_hud_position=Shift_R+F11
