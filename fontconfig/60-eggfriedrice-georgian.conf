<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Georgian in FiraGO, whatever font the app asks for, at the nearest of the four weights font-picker
     fetches (Regular, Medium, SemiBold, Bold; no Light or Italic): Medium in the UI, which asks for
     the UI font's Medium, Regular in browsers and Electron apps. The UI fonts have no Georgian letters,
     so Georgian text falls back to another font; these rules make that FiraGO, for both ways apps
     ask: GTK and Pango name the language (ka), Chromium and Electron (Signal, Slack, browsers) only
     the character. FiraGO has Latin too, which is why it can win the character-only lookup:
     fontconfig there prefers fonts that also cover the system language, which a Georgian-only font
     such as Noto Sans Georgian never does. -->
<fontconfig>
  <!-- FiraGO goes last in every font list, weakly bound: Latin, digits and punctuation stay in the fonts
       the app asked for (and the default sans-serif stays the default), and for a Georgian letter it is
       the first listed font that has one, ahead of any Georgian font nobody listed (an old Sylfaen). -->
  <match target="pattern">
    <edit name="family" mode="append_last" binding="weak"><string>FiraGO</string></edit>
  </match>

  <!-- noto-fonts' own rules list its Georgian fonts by name under sans-serif and serif (and so under
       the metric aliases, Helvetica and Arial), which outranks FiraGO at the end of the list: hidden,
       so generic requests reach FiraGO too. They draw only Georgian, which FiraGO covers. -->
  <selectfont>
    <rejectfont>
      <pattern><patelt name="family"><string>Noto Sans Georgian</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Serif Georgian</string></patelt></pattern>
    </rejectfont>
  </selectfont>
</fontconfig>
